name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: podman build --pull=newer -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/my-sway:latest .
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        run: podman push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/my-sway:latest
